name: Update Serenity feed

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 UTC (prices only change once a day; posts hourly if X token is set)
  workflow_dispatch:
    inputs:
      force_prices:
        description: "Re-download all prices now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: serenity-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build feed
        run: python scripts/build_feed.py
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FORCE_PRICES: ${{ inputs.force_prices }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
